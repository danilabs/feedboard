<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard - Custom Layout</title>
  <script type="module" src="../dist/feedboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }

    .news-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 1fr auto;
      height: 100vh;
      gap: 4px;
      padding: 4px;
    }

    .main-feed {
      grid-row: span 2;
    }

    .lower-bar {
      background: linear-gradient(90deg, #1e40af, #7c3aed);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      color: white;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="news-layout">
    <feedboard-player
      class="main-feed"
      src="/test_bars"
      server="http://localhost:8889"
      fit="contain">
    </feedboard-player>

    <feedboard-player
      src="/testsrc"
      server="http://localhost:8889"
      fit="cover">
    </feedboard-player>

    <div class="lower-bar">
      <span class="title">LIVE BROADCAST</span>
      <feedboard-clock format="HH:mm:ss"></feedboard-clock>
    </div>
  </div>
</body>
</html>
