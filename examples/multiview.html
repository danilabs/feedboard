<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard - 2x2 Multiview</title>
  <script type="module" src="../dist/feedboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }
  </style>
</head>
<body>
  <feedboard-grid layout="2x2" server="http://localhost:8889" gap="4px" style="height: 100vh;">
    <feedboard-player src="/test_bars"></feedboard-player>
    <feedboard-player src="/testsrc"></feedboard-player>
    <feedboard-player src="/gradient"></feedboard-player>
    <feedboard-clock format="HH:mm:ss:ff"></feedboard-clock>
  </feedboard-grid>
</body>
</html>
