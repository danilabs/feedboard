# Feedboard Production Stack
#
# Usage:
#   cp .env.template .env   # Configure settings
#   docker compose up -d
#
# Configuration:
#   Edit .env to set DOMAIN, TLS_MODE, JWT_SECRET, etc.
#   See .env.template for all options
#
# Quick start (self-signed TLS):
#   docker compose up -d
#
# Production (Let's Encrypt):
#   Set in .env: DOMAIN=example.com

services:
  feedboard:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:443}
      - MTX_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - authproxy
    networks:
      - feedboard-net

  # MediaMTX runs on host network for optimal WebRTC/UDP performance
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    environment:
      - MTX_AUTHHTTPADDRESS=http://127.0.0.1:8091/auth/hook
      - MTX_AUTHMETHOD=${AUTH_METHOD:-http}
      - INTERNAL_PUBLISH_TOKEN=${INTERNAL_PUBLISH_TOKEN:-}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  authproxy:
    build: ./authproxy
    ports:
      - "127.0.0.1:8091:8091"  # Expose on localhost for mediamtx (host network)
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token-change-in-prod}
      - INTERNAL_PUBLISH_TOKEN=${INTERNAL_PUBLISH_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - authproxy_data:/data
    networks:
      - feedboard-net

  thumbnailer:
    build: ./thumbnailer
    expose:
      - "8090"
    environment:
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token-change-in-prod}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "-mediamtx-api=http://host.docker.internal:9997"
      - "-mediamtx-rtsp=rtsp://host.docker.internal:8554"
    networks:
      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  caddy_data:
  authproxy_data:
