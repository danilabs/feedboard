# Feedboard Production Stack
#
# Usage:
#   docker compose up -d
#
# With custom domain:
#   DOMAIN=example.com TLS_MODE= docker compose up -d
#
# With thumbnailer:
#   docker compose --profile thumbs up -d

services:
  feedboard:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:443}
      - TLS_MODE=${TLS_MODE:-internal}
    volumes:
      - caddy_data:/data
    depends_on:
      - mediamtx
      - authproxy
    networks:
      - feedboard-net

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8890:8890/udp"  # SRT
    expose:
      - "8888"        # HLS (internal)
      - "8889"        # WebRTC (internal)
      - "9997"        # API (internal)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - feedboard-net

  authproxy:
    build: ./authproxy
    expose:
      - "8091"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-}
    volumes:
      - authproxy_data:/data
    networks:
      - feedboard-net

  thumbnailer:
    build: ./thumbnailer
    profiles: [thumbs]
    expose:
      - "8090"
    environment:
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:?Set THUMBNAILER_TOKEN in .env}
    command:
      - "-mediamtx-api=http://mediamtx:9997"
      - "-mediamtx-rtsp=rtsp://mediamtx:8554"
    depends_on:
      - mediamtx
    networks:
      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  caddy_data:
  authproxy_data:
