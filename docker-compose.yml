services:
  feedboard:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:443}
      - TLS_MODE=${TLS_MODE:-internal}
    volumes:
      - caddy_data:/data
    depends_on:
      - mediamtx
    networks:
      - feedboard-net

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
    expose:
      - "8888"        # HLS (internal, proxied by Caddy)
      - "8889"        # WebRTC (internal, proxied by Caddy)
      - "9997"        # API (internal, proxied by Caddy)
    environment:
      - MTX_WEBRTCADDRESS=:8889
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
    networks:
      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  caddy_data:
