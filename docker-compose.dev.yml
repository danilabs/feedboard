# Feedboard Development Stack
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# MediaMTX runs on host network for proper WebRTC/UDP support.
# Works on Linux natively, and on macOS with Docker Desktop's
# "Enable host networking" feature (Settings → Features in development).
#
# Access: https://localhost

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MTX_HOST=${MTX_HOST:-host.docker.internal}
      - VITE_HOST=vite
      - THUMBNAILER_HOST=${THUMBNAILER_HOST:-thumbnailer}
      - AUTH_HOST=authproxy
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - vite
    networks:
      - feedboard-net

  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - feedboard-net

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    environment:
      - MTX_AUTHHTTPADDRESS=http://127.0.0.1:8091/auth/hook
      - MTX_AUTHMETHOD=${AUTH_METHOD:-http}
      - INTERNAL_PUBLISH_TOKEN=${INTERNAL_PUBLISH_TOKEN:-dev-internal-publish-token}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  authproxy:
    build: ./authproxy
    ports:
      - "127.0.0.1:8091:8091"  # Exposed on localhost for mediamtx (host network)
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token-change-in-prod}
      - INTERNAL_PUBLISH_TOKEN=${INTERNAL_PUBLISH_TOKEN:-dev-internal-publish-token}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - authproxy_data:/data
    networks:
      - feedboard-net

  thumbnailer:
    build: ./thumbnailer
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token-change-in-prod}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    command:
      - "-mediamtx-api=http://${MTX_HOST:-host.docker.internal}:9997"
      - "-mediamtx-rtsp=rtsp://${MTX_HOST:-host.docker.internal}:8554"
    depends_on:
      - mediamtx
    networks:
      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  node_modules:
  caddy_data:
  authproxy_data:
