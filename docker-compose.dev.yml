# Feedboard Development Stack
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# With thumbnailer:
#   docker compose -f docker-compose.dev.yml --profile thumbs up
#
# Using local MediaMTX instead of container:
#   MTX_HOST=host.docker.internal docker compose -f docker-compose.dev.yml up
#
# Access: https://localhost

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    environment:
      - MTX_HOST=${MTX_HOST:-mediamtx}
      - VITE_HOST=vite
      - THUMBNAILER_HOST=${THUMBNAILER_HOST:-thumbnailer}
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - vite
    networks:
      - feedboard-net

  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - feedboard-net

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8890:8890/udp"  # SRT
      - "9997:9997"   # API
    expose:
      - "8888"        # HLS
      - "8889"        # WebRTC
    environment:
      - MTX_AUTHHTTPADDRESS=http://authproxy:8091/auth/hook
      - MTX_AUTHMETHOD=${AUTH_METHOD:-http}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - feedboard-net

  authproxy:
    build: ./authproxy
    expose:
      - "8091"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token}
    volumes:
      - authproxy_data:/data
    networks:
      - feedboard-net

  thumbnailer:
    build: ./thumbnailer
    expose:
      - "8090"
    environment:
      - THUMBNAILER_TOKEN=${THUMBNAILER_TOKEN:-dev-thumbnailer-token}
    command:
      - "-mediamtx-api=http://${MTX_HOST:-mediamtx}:9997"
      - "-mediamtx-rtsp=rtsp://${MTX_HOST:-mediamtx}:8554"
    depends_on:
      - mediamtx
    networks:
      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  node_modules:
  caddy_data:
  authproxy_data:
