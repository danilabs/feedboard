# Development stack
# Usage: docker compose -f docker-compose.dev.yml up

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - vite
#      - mediamtx
    networks:
      - feedboard-net

  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - feedboard-net

#  mediamtx:
#    image: bluenviron/mediamtx:latest
#    ports:
#      - "8554:8554"   # RTSP
#      - "1935:1935"   # RTMP
#    expose:
#      - "8888"        # HLS
#      - "8889"        # WebRTC
#      - "9997"        # API
#    environment:
#      - MTX_WEBRTCADDRESS=:8889
#      - MTX_API=yes
#      - MTX_APIADDRESS=:9997
#    networks:
#      - feedboard-net

networks:
  feedboard-net:
    driver: bridge

volumes:
  node_modules:
  caddy_data:
