<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Feedboard</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./base.css">
  <script type="module" src="./feedboard.js"></script>
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      color: #3b82f6;
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.75rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      font-size: 0.875rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .form-input:focus {
      outline: none;
      border-color: #2563eb;
      background: #1a1a1a;
    }
    .form-input::placeholder {
      color: #444;
    }
    .login-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #1e3a5f;
      border: 1px solid #2563eb;
      border-radius: 8px;
      color: #60a5fa;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 0.5rem;
    }
    .login-btn:hover {
      background: #234876;
      color: #93c5fd;
    }
    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-message {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #f87171;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.15"/>
          <rect x="13" y="2" width="9" height="9" rx="1.5"/>
          <rect x="2" y="13" width="9" height="9" rx="1.5"/>
          <rect x="13" y="13" width="9" height="9" rx="1.5"/>
          <path d="M5.5 5L8 6.5 5.5 8z" fill="currentColor" stroke="none"/>
        </svg>
        <h1 class="login-title">Feedboard</h1>
        <p class="login-subtitle">Sign in to continue</p>
      </div>

      <div id="error" class="error-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('login-btn');

    // Get redirect URL from query params
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect') || '/';

    // Check if already logged in
    fetch('/auth/me', { credentials: 'same-origin' })
      .then(res => { if (res.ok) window.location.href = redirect; })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorEl.classList.remove('visible');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
          credentials: 'same-origin',
        });

        if (res.ok) {
          window.location.href = redirect;
        } else {
          const text = await res.text();
          errorEl.textContent = text || 'Login failed';
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
