<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard - Player</title>
  <script type="module" src="./feedboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
    }
    feedboard-player {
      width: 100%;
      height: 100%;
    }
    .hint {
      position: fixed;
      bottom: 0.5rem;
      right: 0.5rem;
      color: rgba(255, 255, 255, 0.25);
      font-family: system-ui, sans-serif;
      font-size: 0.6rem;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <feedboard-player id="player" muted fill></feedboard-player>
  <div class="hint" id="hint">I: info · M: mute · R: reconnect · F: fullscreen</div>

  <script type="module">
    const params = new URLSearchParams(window.location.search)
    const player = document.getElementById('player')
    const hint = document.getElementById('hint')

    // Setup from URL params
    if (params.get('server')) {
      player.setAttribute('server', params.get('server'))
    }
    if (params.get('src')) {
      player.setAttribute('src', params.get('src'))
      document.title = `${params.get('src')} - Feedboard`
    }
    if (params.get('protocol')) {
      player.setAttribute('protocol', params.get('protocol'))
    }

    // Connect after attributes are set
    if (params.get('src')) {
      player.connect()
    }

    let showInfo = false

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Skip if typing in select
      if (e.target.tagName === 'SELECT') return

      switch (e.key.toLowerCase()) {
        case 'i':
          showInfo = !showInfo
          player.showInfo = showInfo
          hint.classList.toggle('hidden', showInfo)
          e.preventDefault()
          break
        case 'm':
          player.muted = !player.muted
          break
        case 'r':
          player.disconnect()
          player.connect()
          break
        case 'f':
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen()
          } else {
            document.exitFullscreen()
          }
          break
        case 'escape':
          if (showInfo) {
            showInfo = false
            player.showInfo = false
            hint.classList.remove('hidden')
          }
          break
      }
    })
  </script>
</body>
</html>
