<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard - Capture</title>
  <script type="module" src="/src/index.ts"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }
    feedboard-capture {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <feedboard-capture id="capture"></feedboard-capture>
  <script type="module">
    const params = new URLSearchParams(window.location.search)
    const capture = document.getElementById('capture')

    if (params.get('server')) {
      capture.setAttribute('server', params.get('server'))
    }
    if (params.get('path')) {
      capture.setAttribute('publish-path', params.get('path'))
    }
  </script>
</body>
</html>
