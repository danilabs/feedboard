<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard Components Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 300;
    }
    .controls {
      text-align: center;
      margin-top: 2rem;
    }
    .toggle-btn {
      background: #333;
      border: 1px solid #444;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .toggle-btn:hover {
      background: #444;
    }
    .toggle-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 1rem;
      background: #222;
      font-size: 0.875rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-content {
      aspect-ratio: 16/9;
      position: relative;
      overflow: hidden;
    }
    .card-footer {
      padding: 0.75rem 1rem;
      background: #222;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-footer label {
      font-size: 0.75rem;
      color: #888;
    }
    .card-footer select {
      flex: 1;
      padding: 0.4rem 0.5rem;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-size: 0.8rem;
    }
    .card-footer select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .card-footer button {
      padding: 0.4rem 0.6rem;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .card-footer button:hover {
      background: #444;
    }
    feedboard-player,
    feedboard-capture,
    feedboard-clock {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .info {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #1a1a1a;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #aaa;
    }
    .info code {
      background: #333;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .info pre {
      background: #0d0d0d;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>Feedboard Components</h1>

  <div class="grid">
    <div class="card">
      <div class="card-header">Player – WHEP Stream</div>
      <div class="card-content">
        <feedboard-player
          id="player"
          src="/testsrc"
          protocol="whep"
          show-info
          show-vu
        ></feedboard-player>
      </div>
      <div class="card-footer">
        <label>Stream</label>
        <select id="stream-select">
          <option value="/testsrc">testsrc</option>
        </select>
        <button id="refresh-stream" title="Refresh">↻</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Capture – Camera/Screen</div>
      <div class="card-content">
        <feedboard-capture
          type="camera"
          show-info
          show-vu
        ></feedboard-capture>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Clock</div>
      <div class="card-content">
        <feedboard-clock id="clock" format="HH:mm:ss" label="Local"></feedboard-clock>
      </div>
      <div class="card-footer">
        <label>Timezone</label>
        <select id="tz-select">
          <option value="">Local</option>
          <option value="America/New_York">New York</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="America/Chicago">Chicago</option>
          <option value="Europe/London">London</option>
          <option value="Europe/Paris">Paris</option>
          <option value="Europe/Berlin">Berlin</option>
          <option value="Asia/Tokyo">Tokyo</option>
          <option value="Asia/Shanghai">Shanghai</option>
          <option value="Australia/Sydney">Sydney</option>
          <option value="UTC">UTC</option>
        </select>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="toggle-btn active" id="toggle-info">Hide Info</button>
  </div>

  <script>
    // Auto-detect: use direct ports for localhost, otherwise use current origin (via Caddy)
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    window.FEEDBOARD_CONFIG = isLocal ? {
      webrtc: 'http://localhost:8889',
      hls: 'http://localhost:8888',
      api: 'http://localhost:9997',
      auth: { enabled: false }
    } : {
      webrtc: location.origin,
      hls: location.origin,
      api: location.origin,
      auth: { enabled: true }
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Toggle info overlays
      const btn = document.getElementById('toggle-info');
      let showInfo = true;

      btn.addEventListener('click', () => {
        showInfo = !showInfo;
        btn.classList.toggle('active', showInfo);
        btn.textContent = showInfo ? 'Hide Info' : 'Show Info';
        document.querySelectorAll('feedboard-player, feedboard-capture').forEach(el => {
          if (showInfo) {
            el.setAttribute('show-info', '');
          } else {
            el.removeAttribute('show-info');
          }
        });
      });

      // Stream chooser
      const streamSelect = document.getElementById('stream-select');
      const player = document.getElementById('player');

      streamSelect.addEventListener('change', (e) => {
        player.setAttribute('src', e.target.value);
      });

      const refreshStreams = async () => {
        try {
          const res = await fetch(window.FEEDBOARD_CONFIG.api + '/v3/paths/list');
          const data = await res.json();
          const paths = (data.items || []).filter(p => p.ready).map(p => p.name);
          const current = streamSelect.value;
          streamSelect.innerHTML = paths.map(p =>
            `<option value="/${p}"${('/' + p) === current ? ' selected' : ''}>${p}</option>`
          ).join('');
        } catch (e) {
          console.warn('Could not fetch streams:', e);
        }
      };

      document.getElementById('refresh-stream').addEventListener('click', refreshStreams);
      refreshStreams();

      // Timezone chooser
      document.getElementById('tz-select').addEventListener('change', (e) => {
        const clock = document.getElementById('clock');
        const tz = e.target.value;
        clock.setAttribute('timezone', tz);
        clock.setAttribute('label', tz ? e.target.selectedOptions[0].text : 'Local');
      });
    });
  </script>
  <script type="module" src="/feedboard.js"></script>
</body>
</html>
