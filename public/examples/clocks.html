<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedboard - World Clocks</title>
  <script type="module" src="../feedboard.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; }
  </style>
</head>
<body>
  <feedboard-grid layout="2x2" gap="4px">
    <!-- New York clock -->
    <feedboard-clock
      timezone="America/New_York"
      label="NEW YORK"
      format="HH:mm:ss"
      show-date="YYYY-MM-DD"
      background="#1a1a2e"
      color="#e94560"
    ></feedboard-clock>

    <!-- London clock -->
    <feedboard-clock
      timezone="Europe/London"
      label="LONDON"
      format="HH:mm:ss"
      background="#16213e"
      color="#00fff5"
    ></feedboard-clock>

    <!-- Tokyo clock -->
    <feedboard-clock
      timezone="Asia/Tokyo"
      label="TOKYO"
      format="HH:mm:ss"
      background="#0f0f0f"
      color="#ff6b6b"
    ></feedboard-clock>

    <!-- Local timecode with frames -->
    <feedboard-clock
      label="TIMECODE"
      format="HH:mm:ss:ff"
      framerate="30"
      background="#1a1a1a"
      color="#00ff00"
    ></feedboard-clock>
  </feedboard-grid>
</body>
</html>
